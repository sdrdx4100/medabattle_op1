[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.11.0", "cmake>=3.18"]
build-backend = "setuptools.build_meta"

[project]
name = "medabattle"
version = "0.1.0"
description = "Medabot-style robot battle simulation game"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["game", "simulation", "battle", "medabot"]
authors = [
    {name = "sdrdx4100"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyxel>=2.0.0",
    "pyyaml>=6.0",
    "polars>=0.19.0",
    "pybind11>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
analysis = [
    "duckdb>=0.9.0",
    "plotly>=5.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
medabattle = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
