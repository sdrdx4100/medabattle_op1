# Sample simulation configuration
# This file defines the battle setup for simulation runs

name: "default"
description: "Default balanced battle configuration"

# Team sizes
team_a_size: 3
team_b_size: 3

# Strategy for each team
# Options: random, aggressive, defensive, medal
team_a_strategy: "medal"
team_b_strategy: "aggressive"

# Maximum turns before declaring a draw
max_turns: 1000

# Random seed for reproducibility (null for random)
seed: null

